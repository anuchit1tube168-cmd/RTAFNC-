name: Campus API Safety CI

on:
  push:
    paths:
      - 'apps/rtafnc-campus-api/**'
      - '.github/workflows/campus-api-ci.yml'
  pull_request:
    paths:
      - 'apps/rtafnc-campus-api/**'
      - '.github/workflows/campus-api-ci.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Worker syntax
        run: node --check apps/rtafnc-campus-api/src/index.js

      - name: Validate UAT schema contract in memory
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          root = Path('apps/rtafnc-campus-api/migrations')
          db = sqlite3.connect(':memory:')
          for path in sorted(root.glob('*.sql')):
              db.executescript(path.read_text(encoding='utf-8'))

          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {
              'source_registry', 'system_config', 'student_core_staging',
              'staff_core_staging', 'advisor_group_assignments_staging',
              'advisor_bindings_staging', 'integration_gates',
              'good_deed_source_profile', 'sync_runs'
          }
          missing = required - tables
          if missing:
              raise SystemExit(f'missing contract tables: {sorted(missing)}')

          obsolete = {'core_students', 'core_staff', 'advisor_bindings'} & tables
          if obsolete:
              raise SystemExit(f'obsolete duplicate schema detected: {sorted(obsolete)}')

          cfg = dict(db.execute('SELECT key, value FROM system_config'))
          expected = {
              'environment': 'uat',
              'production_write': 'false',
              'production_write_enabled': 'false',
              'source_policy': 'google_drive_master_read_only',
              'identity_business_key': 'student_id_7_digits',
              'staff_login_enabled': 'false',
              'advisor_auth_enabled': 'false',
              'health_migration_enabled': 'false',
              'legacy_auth_reuse': 'false',
              'runtime': 'cloudflare-only',
          }
          mismatches = {k: (cfg.get(k), v) for k, v in expected.items() if cfg.get(k) != v}
          if mismatches:
              raise SystemExit(f'unsafe/missing UAT defaults: {mismatches}')

          source_count = db.execute('SELECT COUNT(*) FROM source_registry').fetchone()[0]
          if source_count != 0:
              raise SystemExit('contract fixture must not seed provider/source registry rows')

          print('UAT schema contract + fail-closed defaults: PASS')
          PY

      - name: Enforce deployment posture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('apps/rtafnc-campus-api/wrangler.example.jsonc')
          cfg_text = path.read_text(encoding='utf-8')
          data = json.loads(cfg_text)
          vars_ = data.get('vars', {})

          if vars_.get('ENVIRONMENT') != 'uat':
              raise SystemExit('example environment must remain uat')
          if vars_.get('PRODUCTION_WRITE') != 'false':
              raise SystemExit('PRODUCTION_WRITE must remain false')
          if vars_.get('EXPOSE_SOURCE_STATUS') != 'false':
              raise SystemExit('source-status endpoint must remain disabled by default')
          if 'REPLACE_WITH_EXISTING_UAT_D1_DATABASE_ID' not in cfg_text:
              raise SystemExit('public example must not contain a real D1 database id')
          if 'migrations_dir' in cfg_text:
              raise SystemExit('UAT example must not auto-apply migrations')

          d1 = data.get('d1_databases', [])
          if len(d1) != 1 or d1[0].get('database_name') != 'rtafnc-campus-uat':
              raise SystemExit('example must target the existing UAT database name only')

          print('Deployment posture: UAT read-only, migrations disabled')
          PY

      - name: Prevent private Drive URLs in public source
        run: |
          if grep -R -n -E 'https://(drive|docs)\.google\.com' apps/rtafnc-campus-api; then
            echo 'Private Google Drive URL found in public source.'
            exit 1
          fi

      - name: Basic secret and provider-id guard
        run: |
          if grep -R -n -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|service_account_key|LINE_CHANNEL_SECRET=|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' apps/rtafnc-campus-api; then
            echo 'Possible secret or real provider resource ID found.'
            exit 1
          fi

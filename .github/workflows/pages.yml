name: RTAFNC Pages Validation

on:
  push:
    branches: [main]
    paths:
      - 'apps/liff/**'
      - 'apps/admin/**'
      - 'apps/rtafnc-one-uat/**'
      - 'apps/rtafnc-portal/**'
      - 'apps/procurement-v3/**'
      - 'procurement-v3.html'
      - 'supabase/functions/line-auth/**'
      - 'supabase/migrations/**'
      - 'docs/PRODUCTION_GAP_ANALYSIS.md'
      - 'tests/static-contract.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static application
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/liff/app-runtime.js
          node --check apps/liff/interaction-hotfix.js
          node --check apps/liff/config.js
          node --check apps/admin/app.js
          node --check apps/admin/interaction-hotfix.js
          node --check apps/admin/config.js
          node --check apps/rtafnc-portal/assets/app.js
          node tests/static-contract.test.mjs

          test -s apps/liff/index.html
          test -s apps/liff/styles.css
          test -s apps/liff/extensions.css
          test -s apps/admin/index.html
          test -s apps/admin/styles.css
          test -s apps/rtafnc-one-uat/index.html
          test -s apps/rtafnc-one-uat/uat.json
          test -s apps/rtafnc-portal/index.html
          test -s apps/rtafnc-portal/assets/styles.css
          test -s apps/rtafnc-portal/assets/app.js
          test -s apps/procurement-v3/index.html
          test -s apps/procurement-v3/db-config.json
          test -s procurement-v3.html

          grep -q 'PRODUCTION WRITE OFF' apps/rtafnc-one-uat/index.html
          grep -q '"production_write": false' apps/rtafnc-one-uat/uat.json
          grep -q '"contains_operational_pii": false' apps/rtafnc-one-uat/uat.json

          grep -q 'rtafnc-procurement-v3-api.anuchit1tube168.workers.dev' apps/procurement-v3/index.html
          grep -q 'Production write' apps/procurement-v3/index.html
          grep -q 'OFF' apps/procurement-v3/index.html
          grep -q '"productionWrite": false' apps/procurement-v3/db-config.json
          grep -q '"directBrowserSheetsWrite": false' apps/procurement-v3/db-config.json
          grep -q 'apps/procurement-v3/index.html' procurement-v3.html

      - name: Confirm single publisher policy
        run: |
          echo 'Validation only. GitHub dynamic Pages is the sole publisher for this repository.'
